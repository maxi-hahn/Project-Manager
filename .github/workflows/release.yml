name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build executable
        run: |
          python -m PyInstaller --onedir --windowed --noconfirm --name "ProjectManager" --icon=assets/icon.ico gui.py

      - name: Create ZIP
        run: |
          Compress-Archive -Path dist/ProjectManager/* -DestinationPath ProjectManager-${{ github.ref_name }}.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ProjectManager-${{ github.ref_name }}.zip
          generate_release_notes: true
